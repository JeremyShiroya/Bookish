import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ── App version ──────────────────────────────────────────────────────────────
// The APK's version is DERIVED, never hand-written, so it can't drift from what
// the app reports about itself. It mirrors nuxt.config.ts exactly:
//
//   versionName ← package.json "version"        (= runtimeConfig.appVersion)
//   versionCode ← git commit count              (= runtimeConfig.buildNumber)
//
// so the About screen and the installed APK always agree.
//
// versionCode carries real weight: Android refuses to install an APK whose code
// is lower than the installed one, and every update mechanism compares it. It
// must never be a constant and must never go backwards — hence a commit count
// (monotonic by construction) rather than a timestamp or a literal.

ext.resolveVersionName = {
    def packageJson = new File(rootDir, '../package.json')
    if (!packageJson.exists()) {
        throw new GradleException("Cannot resolve versionName: ${packageJson.canonicalPath} not found.")
    }
    def version = new JsonSlurper().parse(packageJson)?.version
    if (!version) {
        throw new GradleException('Cannot resolve versionName: package.json has no "version" field.')
    }
    return version.toString()
}

ext.resolveVersionCode = {
    // Same override nuxt.config.ts honours, so a CI build can pin both layers
    // to one number.
    def override = System.getenv('BOOKISH_BUILD_NUMBER')
    if (override?.trim()) {
        def parsed = override.trim()
        if (!parsed.isInteger()) {
            throw new GradleException("BOOKISH_BUILD_NUMBER must be an integer, got '${parsed}'.")
        }
        return parsed.toInteger()
    }

    def count = null
    try {
        def process = new ProcessBuilder(['git', 'rev-list', '--count', 'HEAD'])
            .directory(rootDir)
            .start()
        def output = process.inputStream.text.trim()
        process.waitFor()
        if (process.exitValue() == 0 && output.isInteger()) {
            count = output.toInteger()
        }
    } catch (Exception ignored) {
        count = null
    }

    // Deliberately fail instead of falling back to a placeholder. A wrong
    // versionCode is unrecoverable in the field: ship a too-high one and every
    // later build is refused as a downgrade; ship a constant and no user is
    // ever offered the update.
    if (!count) {
        throw new GradleException(
            'Cannot resolve versionCode: git history unavailable. '
            + 'Build from a git clone, or set BOOKISH_BUILD_NUMBER to an integer.')
    }
    return count
}

// Release signing.
//
// Credentials live in android/keystore.properties (git-ignored) or in the
// environment, so nothing secret is ever committed. When neither is present the
// release build simply stays unsigned instead of failing — a debug build, CI
// checkout, or fresh clone must still work without the keystore.
//
// IMPORTANT — read scripts/sign-release-apk.sh before switching a phone that
// already has a debug-signed install: Android refuses an update whose signature
// differs, and uninstalling wipes the library. The rotation lineage in that
// script is what lets a release-signed APK replace a debug-signed one in place.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def resolveSigning = { String key, String envName ->
    def value = keystoreProperties.getProperty(key) ?: System.getenv(envName)
    return value?.trim() ? value.trim() : null
}

ext.releaseStoreFile = resolveSigning('storeFile', 'BOOKISH_KEYSTORE_FILE')
ext.releaseStorePassword = resolveSigning('storePassword', 'BOOKISH_KEYSTORE_PASSWORD')
ext.releaseKeyAlias = resolveSigning('keyAlias', 'BOOKISH_KEY_ALIAS')
ext.releaseKeyPassword = resolveSigning('keyPassword', 'BOOKISH_KEY_PASSWORD')
ext.hasReleaseSigning = ext.releaseStoreFile && ext.releaseStorePassword && ext.releaseKeyAlias && ext.releaseKeyPassword

android {
    namespace = "com.bookish.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bookish.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.ext.resolveVersionCode()
        versionName project.ext.resolveVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (project.ext.hasReleaseSigning) {
            release {
                // rootProject.file, NOT file(): this script is the :app module,
                // so a relative path here would resolve under android/app/ while
                // keystore.properties sits — and is naturally written relative
                // to — android/. Absolute paths pass through unchanged.
                storeFile rootProject.file(project.ext.releaseStoreFile)
                storePassword project.ext.releaseStorePassword
                keyAlias project.ext.releaseKeyAlias
                keyPassword project.ext.releaseKeyPassword
                // v1/v2 for older installers, v3 because the rotation lineage
                // that lets a new key replace the old one lives in the v3 block.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.ext.hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:1.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

